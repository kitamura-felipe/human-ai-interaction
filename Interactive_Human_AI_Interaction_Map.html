.taxonomy-label{font-size:18px;font-weight:750}
.taxonomy-description{font-size:13.2px;fill:var(--ink)}
.taxonomy-rows{font-size:13px;fill:#60758e}

.scenario.numerator .scenario-card{stroke:#157db8;stroke-width:4.5;filter:url(#blue-shadow)}

<script>
(function(){
 const cards=[...document.querySelectorAll('.scenario')];
 const metricCards=[...document.querySelectorAll('.interactive-box')];
 function activate(el){
  const n=new Set((el.dataset.numerator||'').split(','));
  const d=new Set((el.dataset.denominator||'').split(','));
  metricCards.forEach(m=>m.classList.toggle('active',m===el));
  cards.forEach(c=>{ const id=c.dataset.scenario;c.classList.toggle('numerator',n.has(id));c.classList.toggle('denominator',!n.has(id)&&d.has(id));c.classList.toggle('dimmed',!d.has(id)); });
 }
 function clear(){metricCards.forEach(m=>m.classList.remove('active'));cards.forEach(c=>c.classList.remove('numerator','denominator','dimmed'));}
 metricCards.forEach(m=>{m.addEventListener('mouseenter',()=>activate(m));m.addEventListener('mouseleave',clear);m.addEventListener('focus',()=>activate(m));m.addEventListener('blur',clear);m.addEventListener('click',()=>{if(m.classList.contains('active')) clear(); else activate(m);});});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')clear();});
})();
</script></body></html>
